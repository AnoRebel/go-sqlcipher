version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.DB).Exec
        - (*database/sql.Rows).Close
        - (*database/sql.Rows).Scan
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Conn).Close
        - (*database/sql.Conn).Raw
        - (*os.File).Close
        - (*os.File).Write
        - os.Remove
        - (io.Closer).Close
        - (database/sql/driver.Stmt).Close
        - (database/sql/driver.Rows).Close
    govet:
      disable:
        # go:fix inline suggestions (e.g. reflect.Ptr, ioutil) in vendored
        # go-sqlite3 code; upstream decides when to modernize
        - inline
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Disable errcheck in test files — upstream go-sqlite3 tests intentionally
      # ignore errors on cleanup/setup calls throughout
      - path: _test\.go
        linters:
          - errcheck
      # convert.go is upstream go-sqlite3 code kept for compatibility
      - path: convert\.go
        linters:
          - unused
      # Upstream error strings are capitalized — not worth changing
      - linters:
          - staticcheck
        text: "ST1005"
      # Upstream ineffectual assignments, dead values and unused helpers in tests
      - path: _test\.go
        linters:
          - ineffassign
          - unused
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA4006|SA1019: io/ioutil"
      # Style-only quickfix suggestions in vendored go-sqlite3 code; patching
      # them would be undone by every upstream sync
      - linters:
          - staticcheck
        text: "QF1007|QF1008|S1021"
      # Upstream best-effort ROLLBACK after a failed COMMIT
      - path: sqlite3\.go
        linters:
          - errcheck
        text: "tx.c.exec"
    paths:
      - _example
      - util

formatters:
  enable:
    - gofmt
